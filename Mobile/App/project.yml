# The iOS app's Xcode project, generated by xcodegen (Mobile/Scripts/build-app
# runs it). The generated CherryMobile.xcodeproj is git-ignored.
name: CherryMobile
options:
  bundleIdPrefix: dev.patrick.cherry
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CherryMobileKit:
    path: ../CherryMobileKit
  GhosttyKit:
    path: ../../ThirdParty/libghostty-spm
  # The conversation's collection view layout (ConversationList.swift).
  ChatLayout:
    url: https://github.com/ekazaev/ChatLayout
    exactVersion: 2.5.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CherryMobile:
    type: application
    platform: iOS
    sources:
      - path: CherryMobile
    dependencies:
      - package: CherryMobileKit
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: ChatLayout
        product: ChatLayout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.patrick.cherry.mobile
        PRODUCT_NAME: CherryMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # The URL scheme pairing codes open, which build settings cannot say.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cherry
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Cherry connects to your Macs on this network over SSH."
        INFOPLIST_KEY_NSCameraUsageDescription: "Cherry reads the pairing code your Mac shows."
        # SSH's encryption is the system's: swift-crypto defers to CryptoKit on
        # Apple platforms and the app bundles no crypto library, so it is
        # exempt and App Store Connect asks no compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  CherryMobile:
    build:
      targets:
        CherryMobile: all
    run:
      config: Debug
