name: Select Xcode
description: >-
  Select an installed Xcode whose Swift satisfies Package.swift's swift-tools-version (the
  image's default when new enough, else the newest stable one) and export DEVELOPER_DIR.

outputs:
  developer-dir:
    description: The selected Xcode's Developer directory.
    value: ${{ steps.select.outputs.developer-dir }}

runs:
  using: composite
  steps:
    - name: Select an Xcode for the package's Swift tools version
      id: select
      shell: bash
      run: |
        required=$(sed -n 's#^// swift-tools-version: *\([0-9][0-9.]*\).*#\1#p' Package.swift | head -n 1)
        at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
        swift_version() {
          DEVELOPER_DIR="$1" xcrun swift --version 2>/dev/null \
            | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1
        }
        # Prefer the image's default Xcode, else the newest stable one.
        selected=$(xcode-select -p)
        if ! at_least "$(swift_version "$selected")" "$required"; then
          selected=""
          candidates=$(printf '%s\n' /Applications/Xcode_*.app \
            | grep -viE 'beta|_rc|release_candidate' | sort -V -r || true)
          while IFS= read -r app; do
            [ -d "$app" ] || continue
            if at_least "$(swift_version "$app/Contents/Developer")" "$required"; then
              selected="$app/Contents/Developer"
              break
            fi
          done <<< "$candidates"
        fi
        if [ -z "$selected" ]; then
          echo "::error::No installed Xcode provides Swift $required"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
        echo "developer-dir=$selected" >> "$GITHUB_OUTPUT"
        DEVELOPER_DIR="$selected" xcrun swift --version
