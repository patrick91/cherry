name: Portable session host

on:
  push:
    branches-ignore: [main]   # main runs this through prerelease.yml (workflow_call)
    paths:
      - "Host/**"
      - "Scripts/*host*"
      - ".github/workflows/host.yml"
      - ".github/actions/host-toolchain/**"
  pull_request:
    paths:
      - "Host/**"
      - "Scripts/*host*"
      - ".github/workflows/host.yml"
      - ".github/actions/host-toolchain/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The ssh job's Debian 12 container (Scripts/test-host-linux) covers
        # an older Linux userland than these runners.
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and the pinned Ghostty VT library
        uses: ./.github/actions/host-toolchain
      # apt's Neovim (0.9 on 24.04) predates the terminal queries current
      # Neovim sends at startup. Keep the version and digests in sync with
      # Host/tests/Dockerfile.
      - name: Install Neovim on Linux
        if: runner.os == 'Linux'
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; digest=474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87 ;;
            aarch64) arch=arm64; digest=8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815 ;;
            *) echo "No pinned Neovim build for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/nvim.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-$arch.tar.gz"
          echo "$digest  $archive" | sha256sum -c -
          sudo mkdir -p /opt/nvim
          sudo tar -xzf "$archive" -C /opt/nvim --strip-components=1
          sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
      - name: Install Neovim on macOS
        if: runner.os == 'macOS'
        run: brew list --versions neovim || brew install neovim
      - name: Check formatting
        run: cargo fmt --manifest-path Host/Cargo.toml --all -- --check
      # Host/THIRD_PARTY_NOTICES.txt ships with the helpers: it must name
      # every crate Cargo.lock builds (Scripts/host-notices --write).
      - name: Check the dependency notices
        run: Scripts/host-notices --check
      - name: Lint
        run: cargo clippy --manifest-path Host/Cargo.toml --locked --workspace --all-targets -- -D warnings
      # Host/Cargo.toml's rust-version, which resolver 3 makes `cargo update`
      # respect, must still build the workspace. Keep the two in step.
      - name: Check the minimum supported Rust version
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --manifest-path Host/Cargo.toml --locked --workspace --all-targets
      - name: Test
        run: cargo test --manifest-path Host/Cargo.toml --locked --workspace -- --test-threads=1
      - name: Build host and client
        run: cargo build --manifest-path Host/Cargo.toml --locked --bins
      - name: Exercise real host reconnect
        run: cargo test --manifest-path Host/Cargo.toml --locked -p cherry-cli --test real_host -- --ignored --test-threads=1
      # Every ignored test in cherry-host and cherry-vt runs here, including
      # any host-level Neovim test.
      - name: Exercise real Neovim restoration
        run: |
          nvim --version | head -n 1
          cargo test --manifest-path Host/Cargo.toml --locked -p cherry-host -p cherry-vt -- --ignored --test-threads=1

  ssh:
    name: SSH client to a Linux host
    # Runs the Debian 12 Docker suite (Scripts/test-host-linux), then the real
    # SSH, gateway and Neovim test against that container with disposable keys.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and the pinned Ghostty VT library
        uses: ./.github/actions/host-toolchain
      - name: Test through SSH
        run: Scripts/test-host-ssh
