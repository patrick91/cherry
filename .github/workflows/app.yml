name: Mac app

on:
  push:
    # main runs this workflow through prerelease.yml (workflow_call), which
    # publishes a pre-release once it and host.yml pass.
    branches-ignore: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "ThirdParty/**"
      - "Host/**"
      - "Scripts/**"
      - "script/**"
      - "Packaging/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "ThirdParty/**"
      - "Host/**"
      - "Scripts/**"
      - "script/**"
      - "Packaging/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  swift:
    name: Swift build and hosted-session tests
    # The package requires macOS 26, so its tests only run on macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select an Xcode for the package's Swift tools version
        uses: ./.github/actions/xcode
      - name: Install Rust and the pinned Ghostty VT library
        uses: ./.github/actions/host-toolchain
      # Before any Swift test: the real-host tests run Host/target/debug/cherry
      # and cherry-host.
      - name: Build the Rust host helpers
        run: Scripts/build-host debug
      # The teardown Scripts/test-packaged-app and Scripts/test-mcp-concurrency
      # use so that their Cherry's private session host leaves nothing behind.
      - name: Private session-host teardown for the GUI test scripts
        env:
          CHERRY_TEST_HOST_INTEGRATION: "1"
        run: python3 Scripts/test_cherry_private_host.py -v
      # Scripts/cherry-release, sparkle-key.swift and the release shell scripts
      # (docs/releasing.md); the release-tooling job runs them on Linux too.
      - name: Release tooling tests
        run: python3 Scripts/test_cherry_release.py -v
      - name: Build the Swift package and tests
        run: swift build --build-tests
      # Every hosted and persistent session suite: PersistentLocal*,
      # PersistentTab*, WorkspacePersistence*, WorkspaceRestore*, HostControl*,
      # HostedSession*, HostedLaunchSpec*, NativeSurfaceRelaunch*,
      # MultiplexerSafety*, AgentInputSafety*, SessionCloseFlow*, AppIdentity
      # and AppUpdate, among the groups Scripts/test-session-suites lists. Each
      # group runs on its own and must pass at least one test, so a filter that
      # stops matching (a rename) fails instead of passing with nothing run. A
      # session test file no group selects, or a test skipped here that the
      # real-host step does not run, fails too.
      - name: Hosted and persistent session tests
        timeout-minutes: 20
        run: Scripts/test-session-suites --skip-build unit
      # Every *RealHost* test (HostedSessionRealHost*, PersistentLocalRealHost*,
      # AgentInputRealHost*, ...), each against its own daemon on a private
      # socket with a private HOME; none may skip.
      - name: Real host through native Ghostty
        timeout-minutes: 20
        run: Scripts/test-session-suites --skip-build real-host
      # Each group's full log (Scripts/test-session-suites writes them under
      # $RUNNER_TEMP/cherry-session-tests.*), for a failed run.
      - name: Upload the session test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-test-logs
          path: ${{ runner.temp }}/cherry-session-tests.*/*.log
          if-no-files-found: ignore
          retention-days: 14

  release-tooling:
    name: Release tooling on Linux
    # publish-appcast, promote-release and publish-github-release run on
    # ubuntu-24.04 in the release workflows: test them there too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release tooling tests
        run: python3 Scripts/test_cherry_release.py -v
      - name: Check the release scripts
        run: |
          scripts="Scripts/release-preflight Scripts/release-plan Scripts/publish-github-release
                   Scripts/publish-appcast Scripts/promote-release Scripts/promote Scripts/release-setup
                   Scripts/sign-app Scripts/package-release Scripts/build-universal"
          for script in $scripts; do bash -n "$script"; done
          # shellcheck disable=SC2086
          shellcheck -S warning $scripts
      # actionlint 1.7.12 predates concurrency.queue (May 2026); its own
      # shellcheck pass is off (the scripts above are checked directly).
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 \
            -color -shellcheck= -ignore 'unexpected key "queue"'
