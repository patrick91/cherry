# The iOS app's Xcode project, generated by xcodegen (Mobile/Scripts/build-app
# runs it). The generated CherryMobile.xcodeproj is git-ignored.
name: CherryMobile
options:
  bundleIdPrefix: dev.patrick.cherry
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CherryMobileKit:
    path: ../CherryMobileKit
  GhosttyKit:
    path: ../../ThirdParty/libghostty-spm
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CherryMobile:
    type: application
    platform: iOS
    sources:
      - path: CherryMobile
    dependencies:
      - package: CherryMobileKit
      - package: GhosttyKit
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.patrick.cherry.mobile
        PRODUCT_NAME: CherryMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cherry
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Cherry connects to your Macs on this network over SSH."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  CherryMobile:
    build:
      targets:
        CherryMobile: all
    run:
      config: Debug
