[workspace]
resolver = "2"
members = ["crates/cherry-protocol", "crates/cherry-host", "crates/cherry-cli", "crates/cherry-vt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.0"

[profile.release]
strip = true
lto = "thin"
