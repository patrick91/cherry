name: Mac app

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "ThirdParty/**"
      - "Host/**"
      - "Scripts/**"
      - ".github/workflows/app.yml"
      - ".github/actions/host-toolchain/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "ThirdParty/**"
      - "Host/**"
      - "Scripts/**"
      - ".github/workflows/app.yml"
      - ".github/actions/host-toolchain/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  swift:
    name: Swift build and hosted-session tests
    # The package requires macOS 26, so its tests only run on macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select an Xcode for the package's Swift tools version
        run: |
          required=$(sed -n 's#^// swift-tools-version: *\([0-9][0-9.]*\).*#\1#p' Package.swift | head -n 1)
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          swift_version() {
            DEVELOPER_DIR="$1" xcrun swift --version 2>/dev/null \
              | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1
          }
          # Prefer the image's default Xcode, else the newest stable one.
          selected=$(xcode-select -p)
          if ! at_least "$(swift_version "$selected")" "$required"; then
            selected=""
            candidates=$(printf '%s\n' /Applications/Xcode_*.app \
              | grep -viE 'beta|_rc|release_candidate' | sort -V -r || true)
            while IFS= read -r app; do
              [ -d "$app" ] || continue
              if at_least "$(swift_version "$app/Contents/Developer")" "$required"; then
                selected="$app/Contents/Developer"
                break
              fi
            done <<< "$candidates"
          fi
          if [ -z "$selected" ]; then
            echo "::error::No installed Xcode provides Swift $required"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcrun swift --version
      - name: Install Rust and the pinned Ghostty VT library
        uses: ./.github/actions/host-toolchain
      # Before any Swift test: the real-host tests run Host/target/debug/cherry
      # and cherry-host.
      - name: Build the Rust host helpers
        run: Scripts/build-host debug
      # The teardown Scripts/test-packaged-app and Scripts/test-mcp-concurrency
      # use so that their Cherry's private session host leaves nothing behind.
      - name: Private session-host teardown for the GUI test scripts
        env:
          CHERRY_TEST_HOST_INTEGRATION: "1"
        run: python3 Scripts/test_cherry_private_host.py -v
      - name: Build the Swift package and tests
        run: swift build --build-tests
      # Every hosted and persistent session suite: PersistentLocal*,
      # PersistentTab*, WorkspacePersistence*, WorkspaceRestore*, HostControl*,
      # HostedSession*, HostedLaunchSpec*, NativeSurfaceRelaunch*,
      # MultiplexerSafety*, AgentInputSafety*, SessionCloseFlow* and
      # AppIdentity. Each group runs on its own and must pass at least one
      # test, so a filter that stops matching (a rename) fails instead of
      # passing with nothing run. A session test file no group selects, or a
      # test skipped here that the real-host step does not run, fails too.
      - name: Hosted and persistent session tests
        timeout-minutes: 20
        run: Scripts/test-session-suites --skip-build unit
      # Every *RealHost* test (HostedSessionRealHost*, PersistentLocalRealHost*,
      # AgentInputRealHost*, ...), each against its own daemon on a private
      # socket with a private HOME; none may skip.
      - name: Real host through native Ghostty
        timeout-minutes: 20
        run: Scripts/test-session-suites --skip-build real-host
      # Each group's full log (Scripts/test-session-suites writes them under
      # $RUNNER_TEMP/cherry-session-tests.*), for a failed run.
      - name: Upload the session test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-test-logs
          path: ${{ runner.temp }}/cherry-session-tests.*/*.log
          if-no-files-found: ignore
          retention-days: 14
